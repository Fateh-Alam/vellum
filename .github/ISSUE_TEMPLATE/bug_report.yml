name: Report a bug
description: Tell us what broke or behaved unexpectedly.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please do not upload your Anki collection, card text, screenshots containing private card content, Mind Notes, or unredacted profile paths.
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Describe what you saw in plain language.
      placeholder: I selected Renal and my AnKing deck, then…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: List the buttons or choices you used. Use generic tag/deck names if the real names are private.
      placeholder: |
        1. Open Study Builder
        2. Choose Find Topics
        3. Search for…
  - type: input
    id: anki_version
    attributes:
      label: Anki version
      placeholder: "26.5"
    validations:
      required: true
  - type: input
    id: vellum_version
    attributes:
      label: Vellum version
      placeholder: 1.1.0
    validations:
      required: true
  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Redacted diagnostic (optional)
      description: You can export this from Vellum → Settings → Data. Check it before posting and remove anything private.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked this report and removed card content, Mind Notes, collection files, and private paths.
          required: true
